# ── PostgreSQL StatefulSet ─────────────────────────────────────────────────────
# StatefulSet (not Deployment) because:
#   - Stable network identity for the primary
#   - Ordered startup/shutdown
#   - PersistentVolumeClaim per pod
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: forensics
  labels:
    app: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres-headless
  replicas: 1           # Single primary; for HA add a read replica via streaming replication
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsUser: 999    # postgres user
        fsGroup: 999

      initContainers:
        # Copy the init SQL onto the data volume so it runs on first start
        - name: copy-init-sql
          image: busybox:1.36
          command:
            - sh
            - -c
            - cp /init/init.sql /docker-entrypoint-initdb.d/init.sql
          volumeMounts:
            - name: init-sql
              mountPath: /init
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d

      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: forensics-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forensics-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: forensics-secrets
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "forensics"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "forensics"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d

      volumes:
        - name: init-sql
          configMap:
            name: postgres-init-sql
        - name: initdb
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
        storageClassName: standard    # Replace with your cloud provider's class

---
# ── Headless Service (for StatefulSet DNS) ─────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: forensics
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432

---
# ── ClusterIP Service (for app connections) ────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: forensics
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
# ── ConfigMap carrying init.sql ────────────────────────────────────────────────
# Mounts the DB bootstrap script into the init container above
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: forensics
data:
  init.sql: |
    CREATE SCHEMA IF NOT EXISTS forensics_audit;
    CREATE SEQUENCE IF NOT EXISTS case_number_seq START 1;

    DO $$ BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'forensics_app') THEN
        CREATE ROLE forensics_app LOGIN PASSWORD 'forensics_app_secret';
      END IF;
    END $$;

    GRANT USAGE ON SCHEMA public TO forensics_app;
    GRANT USAGE ON SCHEMA forensics_audit TO forensics_app;
    GRANT SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA public TO forensics_app;
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO forensics_app;
    GRANT INSERT, SELECT ON forensics_audit.audit_log TO forensics_app;
