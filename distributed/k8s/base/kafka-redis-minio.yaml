# ══════════════════════════════════════════════════════════════════
# KAFKA — KRaft mode (no Zookeeper)
# ══════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: forensics
  labels:
    app: kafka
    app.kubernetes.io/component: message-broker
spec:
  serviceName: kafka-headless
  replicas: 1       # Single broker for dev/staging; 3 for prod HA
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: bitnami/kafka:3.7
          ports:
            - containerPort: 9092
              name: plaintext
            - containerPort: 9093
              name: controller
          env:
            - name: KAFKA_CFG_NODE_ID
              value: "1"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka-headless.forensics.svc.cluster.local:9093"
            - name: KAFKA_CFG_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-service:9092"
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            # Retention: keep audit events for 30 days
            - name: KAFKA_CFG_LOG_RETENTION_HOURS
              value: "720"
            - name: KAFKA_CFG_LOG_RETENTION_BYTES
              value: "1073741824"  # 1GB per partition
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - kafka-topics.sh --bootstrap-server localhost:9092 --list
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: kafka-data
              mountPath: /bitnami/kafka

  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
        storageClassName: standard

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: forensics
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
    - name: controller
      port: 9093

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: forensics
spec:
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
  type: ClusterIP

---
# ── Kafka topic initializer Job ───────────────────────────────────────────────
# Creates required topics with correct retention and replication settings
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: forensics
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z kafka-service 9092; do echo waiting; sleep 3; done
      containers:
        - name: topic-creator
          image: bitnami/kafka:3.7
          command:
            - sh
            - -c
            - |
              kafka-topics.sh --bootstrap-server kafka-service:9092 \
                --create --if-not-exists \
                --topic forensics.custody \
                --partitions 3 --replication-factor 1 \
                --config retention.ms=2592000000

              kafka-topics.sh --bootstrap-server kafka-service:9092 \
                --create --if-not-exists \
                --topic forensics.audit \
                --partitions 3 --replication-factor 1 \
                --config retention.ms=2592000000 \
                --config cleanup.policy=delete

              kafka-topics.sh --bootstrap-server kafka-service:9092 \
                --create --if-not-exists \
                --topic forensics.alerts \
                --partitions 1 --replication-factor 1 \
                --config retention.ms=604800000

              echo "All topics created."

---
# ══════════════════════════════════════════════════════════════════
# REDIS — Rate limiting for the verification portal
# ══════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: forensics
  labels:
    app: redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          args: ["--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: forensics
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP

---
# ══════════════════════════════════════════════════════════════════
# MINIO — S3-compatible evidence file storage
# ══════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: forensics
  labels:
    app: minio
    app.kubernetes.io/component: object-storage
spec:
  serviceName: minio-headless
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: forensics-secrets
                  key: S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forensics-secrets
                  key: S3_SECRET_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: minio-data
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
        storageClassName: standard

---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: forensics
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  type: ClusterIP

---
# ── MinIO bucket initializer Job ──────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: forensics
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -q -O- http://minio-service:9000/minio/health/live; do sleep 3; done
      containers:
        - name: mc
          image: minio/mc:latest
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: forensics-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: forensics-secrets
                  key: S3_SECRET_KEY
          command:
            - sh
            - -c
            - |
              mc alias set local http://minio-service:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
              mc mb --ignore-existing local/forensics-evidence
              mc mb --ignore-existing local/forensics-audit-mirror
              mc anonymous set none local/forensics-evidence
              mc anonymous set none local/forensics-audit-mirror
              echo "Buckets initialised."
