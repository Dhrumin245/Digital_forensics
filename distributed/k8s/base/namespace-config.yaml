# ── Namespace ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: forensics
  labels:
    app.kubernetes.io/part-of: forensicchain
    environment: production

---
# ── ConfigMap — non-secret runtime config ─────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: forensics-config
  namespace: forensics
data:
  DATABASE_URL: "postgresql+asyncpg://forensics:forensics@postgres-service:5432/forensics"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  KAFKA_TOPIC_CUSTODY: "forensics.custody"
  KAFKA_TOPIC_AUDIT: "forensics.audit"
  KAFKA_TOPIC_ALERTS: "forensics.alerts"
  OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger-service:4317"
  S3_ENDPOINT: "http://minio-service:9000"
  S3_BUCKET_EVIDENCE: "forensics-evidence"
  S3_BUCKET_AUDIT_MIRROR: "forensics-audit-mirror"
  REDIS_URL: "redis://redis-service:6379/0"
  SIGNING_KEY_ID: "forensics-verify-key-v1"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
  MAX_EVIDENCE_FILE_SIZE_BYTES: "2147483648"
  VERIFY_RATE_LIMIT_PER_MINUTE: "10"
  VERIFY_RATE_LIMIT_PER_HOUR: "100"
  ALLOWED_ORIGINS: '["https://forensics.yourdomain.com"]'

---
# ── Secret — sensitive credentials (base64 encoded) ───────────────────────────
# In production: use Sealed Secrets, Vault, or External Secrets Operator.
# Values below are placeholders — replace before deploying.
apiVersion: v1
kind: Secret
metadata:
  name: forensics-secrets
  namespace: forensics
type: Opaque
stringData:
  # Generate: openssl genrsa -out private.pem 2048
  JWT_PRIVATE_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_WITH_REAL_PRIVATE_KEY
    -----END RSA PRIVATE KEY-----
  JWT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_REAL_PUBLIC_KEY
    -----END PUBLIC KEY-----
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"
  POSTGRES_PASSWORD: "forensics"
  POSTGRES_USER: "forensics"
  POSTGRES_DB: "forensics"
