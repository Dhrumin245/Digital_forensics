apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus-service:9090
    isDefault: true
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: POST

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger-service:16686
    jsonData:
      tracesToLogs:
        datasourceUid: loki
        tags: ["pod", "namespace"]
      nodeGraph:
        enabled: true
