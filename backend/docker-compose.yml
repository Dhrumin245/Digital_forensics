# ─────────────────────────────────────────────────────────────────────────────
# Forensics System — Local Development Stack
#
# Services:
#   api          — FastAPI app (hot-reload)
#   db           — PostgreSQL 16
#   kafka        — Apache Kafka (KRaft mode, no Zookeeper)
#   minio        — S3-compatible object storage for evidence files
#   redis        — Rate limiting for verification portal
#   prometheus   — Metrics scraper
#   grafana      — Dashboards
#   jaeger       — Distributed tracing (OpenTelemetry)
#
# Start everything:
#   docker compose up -d
#
# API docs:
#   http://localhost:8000/api/v1/docs
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── FastAPI application ─────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: forensics_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://forensics:forensics@db:5432/forensics
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    volumes:
      - .:/app # Hot-reload in dev
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - forensics_net

    # Apply all schema objects, immutability triggers, permissions, and the
    # development seed before serving traffic.  `create_tables()` alone cannot
    # provide those migration-managed database guarantees.
    command: ["/bin/sh", "-c", "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload"]

  audit_mirror_consumer:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: forensics_audit_mirror_consumer
    command: ["python", "kafka/audit_mirror_consumer.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_AUDIT_MIRROR: forensics-audit-mirror
    depends_on:
      kafka:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - forensics_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: forensics_frontend
    ports:
      - "3000:8080"
    environment:
      API_UPSTREAM: api:8000
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - forensics_net

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: forensics_db
    environment:
      POSTGRES_USER: forensics
      POSTGRES_PASSWORD: forensics
      POSTGRES_DB: forensics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forensics"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - forensics_net

  # ── Kafka (KRaft — no Zookeeper) ─────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: forensics_kafka
    ports:
      - "9092:9092"
      - "9093:9093" # Controller port
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Topics created on first message; for production pre-create them
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - forensics_net

  # ── MinIO (S3-compatible object storage) ─────────────────────────────────────
  minio:
    image: elestio/minio:latest
    container_name: forensics_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web console  →  http://localhost:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forensics_net

  # ── MinIO bucket initialiser ──────────────────────────────────────────────────
  minio_init:
    image: amazon/aws-cli:latest
    container_name: forensics_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - >
        until aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1; do
          echo 'Waiting for MinIO...';
          sleep 2;
        done;
        aws --endpoint-url http://minio:9000 s3api create-bucket --bucket forensics-evidence 2>/dev/null || true;
        aws --endpoint-url http://minio:9000 s3api create-bucket --bucket forensics-audit-mirror 2>/dev/null || true;
        echo 'Buckets ready.';
    networks:
      - forensics_net

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: forensics_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - forensics_net

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: forensics_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - forensics_net

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: forensics_grafana
    ports:
      - "3001:3000" # →  http://localhost:3001  (admin/admin)
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - forensics_net

  # ── Jaeger (OpenTelemetry tracing) ────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.61.0
    container_name: forensics_jaeger
    ports:
      - "16686:16686" # UI  →  http://localhost:16686
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - forensics_net

# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  forensics_net:
    driver: bridge
