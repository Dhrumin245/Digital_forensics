version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Forensics System — Local Development Stack
#
# Services:
#   api          — FastAPI app (hot-reload)
#   db           — PostgreSQL 16
#   kafka        — Apache Kafka (KRaft mode, no Zookeeper)
#   minio        — S3-compatible object storage for evidence files
#   redis        — Rate limiting for verification portal
#   prometheus   — Metrics scraper
#   grafana      — Dashboards
#   jaeger       — Distributed tracing (OpenTelemetry)
#
# Start everything:
#   docker compose up -d
#
# API docs:
#   http://localhost:8000/api/v1/docs
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI application ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forensics_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:            postgresql+asyncpg://forensics:forensics@db:5432/forensics
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT:             http://minio:9000
      S3_ACCESS_KEY:           minioadmin
      S3_SECRET_KEY:           minioadmin
      REDIS_URL:               redis://redis:6379/0
      JWT_PRIVATE_KEY:         ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY:          ${JWT_PUBLIC_KEY}
    volumes:
      - .:/app                            # Hot-reload in dev
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - forensics_net

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: forensics_db
    environment:
      POSTGRES_USER:     forensics
      POSTGRES_PASSWORD: forensics
      POSTGRES_DB:       forensics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forensics"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - forensics_net

  # ── Kafka (KRaft — no Zookeeper) ─────────────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    container_name: forensics_kafka
    ports:
      - "9092:9092"
      - "9093:9093"       # Controller port
    environment:
      KAFKA_CFG_NODE_ID:                       1
      KAFKA_CFG_PROCESS_ROLES:                 broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS:      1@kafka:9093
      KAFKA_CFG_LISTENERS:                     PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS:          PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES:     CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE:     "true"
      # Topics created on first message; for production pre-create them
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - forensics_net

  # ── MinIO (S3-compatible object storage) ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: forensics_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"       # API
      - "9001:9001"       # Web console  →  http://localhost:9001
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forensics_net

  # ── MinIO bucket initialiser ──────────────────────────────────────────────────
  minio_init:
    image: minio/mc:latest
    container_name: forensics_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/forensics-evidence;
        mc mb --ignore-existing local/forensics-audit-mirror;
        mc anonymous set none local/forensics-evidence;
        mc anonymous set none local/forensics-audit-mirror;
        echo 'Buckets ready.';
      "
    networks:
      - forensics_net

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: forensics_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - forensics_net

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: forensics_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - forensics_net

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: forensics_grafana
    ports:
      - "3001:3000"        # →  http://localhost:3001  (admin/admin)
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - forensics_net

  # ── Jaeger (OpenTelemetry tracing) ────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.61
    container_name: forensics_jaeger
    ports:
      - "16686:16686"     # UI  →  http://localhost:16686
      - "4317:4317"       # OTLP gRPC receiver
      - "4318:4318"       # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - forensics_net

# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  forensics_net:
    driver: bridge
