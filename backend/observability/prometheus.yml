global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: forensics_api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: kafka
    static_configs:
      - targets: ["kafka:9092"]

  - job_name: postgres
    static_configs:
      - targets: ["db:5432"]
